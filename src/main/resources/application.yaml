spring:
  application:
    name: dishMatch

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    show-sql: true

    hibernate:
      ddl-auto: none

  flyway:
    locations: classpath:db/migrations

  ai:
    google:
      genai:
        api-key: ${GEMINI_KEY}

        chat:
          model: gemini-3.1-flash-lite
          temperature: 0.3
          response-mime-type: application/json

    chat:
      memory:
        repository:
          jdbc:
            # Table is managed by Flyway (V4__Add_chat_memory_table.sql), not Spring AI's own initializer.
            initialize-schema: never

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG